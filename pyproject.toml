[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenpercent-banking77"
version = "0.1.0"
description = "Auditable frozen-weight subnetwork selection and feedback memory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.6.0",
  "transformers>=4.51,<6",
  "datasets>=3,<5",
  "accelerate>=1,<2",
  "safetensors>=0.5,<1",
  "huggingface-hub>=0.30,<2",
  "numpy>=2,<3",
  "cryptography>=44,<47",
  "zstandard>=0.23,<1",
]

[project.scripts]
tenpercent = "tenpercent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/tenpercent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
